<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
        <link rel="stylesheet" href="/CSS/bootstrap.min (1).css">
        <link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            body{
                font-family: "Sour Gummy", sans-serif;
            }
        </style>
</head>
<body>
    <div class="container">
        <h1>Formulário HTML e processamento externo com PHP</h1>

        <hr>

        <form class="" method="post">
            <div class="mb-3">
                <label class="form-label" for="nome">Nome:</label>
                <input class="form-control" type="text" name="nome" id="nome">
            </div>
        
            <div class="mb-3">
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control" type="email" name="email" id="email">
            </div>
        
            <div class="mb-3">
                <label class="form-label" for="idade">Idade:</label>
                <input class="form-control" type="number" name="idade" id="idade">
            </div>

            <div class="mb-3">
                <p class="mb-2">Interesses: </p>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interesses" id="html">
                    <label class="form-check-label" for="html">HTML</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interesses" id="css">
                    <label class="form-check-label" for="css">CSS</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="interesses" id="javascript">
                    <label class="form-check-label" for="javascript">JavaScript</label>
                </div>
            </div>

            <div class="mb-3">
                <p class="mb-2">Deseja receber informativos?</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="informativos" id="sim">
                    <label class="form-check-label" for="sim">Sim</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="informativos" id="nao">
                    <label class="form-check-label" for="nao">Não</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="mensagem" class="form-label">Mensagem: </label>
                <textarea name="mensagem" id="mensagem" rows="2" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar dados</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</body>
</html>
